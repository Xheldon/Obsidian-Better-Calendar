name: Release

# Builds the plugin and publishes a GitHub Release whose assets
# (main.js, manifest.json, styles.css) the Obsidian installer reads.
#
# - On push to main: creates a release for the version in manifest.json,
#   but only if that version has no release yet (bump the version to ship).
# - Manually (workflow_dispatch): re-creates the release for the current
#   version, replacing an existing one — handy to fix a broken release.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read manifest version
        id: meta
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "Release $VERSION already exists; nothing to do."
              exit 0
            fi
            echo "Recreating release $VERSION (workflow_dispatch)."
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            sleep 3
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Better Calendar $VERSION" \
            main.js manifest.json styles.css
